name: Build and deploy SUNITY
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore reviewed source archive
        if: hashFiles('sunity-source.zip') != ''
        run: |
          echo 'f6b74d2fb4bfd687e7590514db1f0eecaa48ac5f2569451eaf586271d9dadbe4  sunity-source.zip' | sha256sum --check
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile('sunity-source.zip') as archive:
              for item in archive.infolist():
                  destination = (root / item.filename).resolve()
                  if not destination.is_relative_to(root) or item.filename.startswith(('.git/', '.github/')):
                      raise SystemExit('Unexpected archive path')
              archive.extractall(root)
          PY
          git rm -r --ignore-unmatch images
          git rm sunity-source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx eslint .
      - run: npm run build
      - name: Commit restored source after successful checks
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Restore Vue sources, organize components and update contact numbers"
            git push origin HEAD:master
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
